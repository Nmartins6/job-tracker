services:
  postgres:
    image: postgres:16-alpine
    # TODO: mover credenciais de exemplo para variaveis externas (.env) antes de usar
    # qualquer ambiente compartilhado ou de deploy.
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    # TODO: remover a exposicao da porta 5432 quando o banco precisar ser acessado
    # apenas pela aplicacao dentro da rede do compose.
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    # TODO: substituir credenciais versionadas por variaveis externas/seguras em
    # ambientes reais de deploy.
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jobtracker
      DB_USERNAME: jobtracker
      DB_PASSWORD: jobtracker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
