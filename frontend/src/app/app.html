<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/workspace">
      <span class="brand-mark">JT</span>
      <span class="brand-copy">
        <strong>JobTracker</strong>
        <span>Acompanhe vagas, etapas e aderencia em um so lugar</span>
      </span>
    </a>

    <nav class="topbar-nav">
      <a routerLink="/workspace" routerLinkActive="active">Painel</a>
      <a routerLink="/login" routerLinkActive="active">Conta</a>
    </nav>

    <div class="topbar-account">
      @if (auth.isAuthenticated()) {
        <span class="account-chip">
          <span class="status-dot"></span>
          {{ auth.displayName() }}
        </span>
        <button class="button button-secondary" type="button" (click)="logout()">
          Encerrar sessão
        </button>
      } @else {
        <a class="button button-secondary" routerLink="/login">Entrar ou criar conta</a>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
